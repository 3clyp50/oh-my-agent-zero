[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-agent-zero"
version = "0.3.0"
description = "Run upstream Agent Zero directly on Windows, macOS, and Linux."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Alessandro Frau"}]
dependencies = []

[project.scripts]
oh-my-agent-zero = "oh_my_agent_zero.cli:main"
a0-native = "oh_my_agent_zero.cli:main"

[tool.setuptools.packages.find]
include = ["oh_my_agent_zero*"]
