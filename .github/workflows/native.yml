name: Native runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OMA0_HOME: ${{ github.workspace }}/.local
      OMA0_PACKAGE_SPEC: ${{ github.workspace }}
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Launcher tests
        run: python -m unittest discover -s tests -v
      - name: Resolve connector release with CI authentication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, subprocess
          from urllib.parse import quote
          tag = quote(subprocess.check_output(["gh", "api", "repos/agent0ai/a0-connector/releases/latest", "--jq", ".tag_name"], text=True).strip(), safe="")
          # Shared runners can exhaust GitHub's unauthenticated release API quota.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"A0_PACKAGE_SPEC=a0 @ https://github.com/agent0ai/a0-connector/archive/refs/tags/{tag}.zip\n")
              env.write(f"A0_RUNTIME_CONSTRAINTS=https://raw.githubusercontent.com/agent0ai/a0-connector/refs/tags/{tag}/constraints/a0-runtime.txt\n")
              env.write(f"A0_BUILD_CONSTRAINTS=https://raw.githubusercontent.com/agent0ai/a0-connector/refs/tags/{tag}/constraints/a0-build.txt\n")
          PY
      - name: Install native runtime and connector on Unix
        if: runner.os != 'Windows'
        run: sh scripts/install.sh
      - name: Install native runtime and connector on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1
      - name: First-start setup and upstream WebUI handoff
        timeout-minutes: 22
        run: python scripts/startup_smoke.py
      - name: HTTP, tools, persistence, and update checks
        timeout-minutes: 8
        run: python scripts/smoke.py --connector --deferred
      - name: Deferred speech and document dependencies
        timeout-minutes: 12
        run: python scripts/feature_smoke.py
      - name: Update without changing user data
        run: python -m oh_my_agent_zero update
      - name: Check source integrity
        run: git -C .local/source diff --exit-code
      - name: Diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ matrix.os }}
          path: .local/*.log
          include-hidden-files: true
